<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>日报导出</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <h1>日报导出</h1>
          <p id="runState" class="run-state">待命</p>
        </div>
        <div class="toolbar">
          <button id="startBtn" class="primary" type="button">开始</button>
          <button id="stopBtn" class="danger" type="button">停止</button>
        </div>
      </header>

      <section class="section">
        <div class="section-title">
          <h2>报表网址列表</h2>
          <button id="addReportBtn" class="ghost" type="button">新增</button>
        </div>
        <div id="reportsList" class="reports-list"></div>
      </section>

      <section class="section">
        <h2>自动登录账户</h2>
        <div class="credential-grid">
          <label>
            <span>账户</span>
            <input id="accountInput" type="text" autocomplete="username" />
          </label>
          <label>
            <span>密码</span>
            <input id="passwordInput" type="password" autocomplete="current-password" />
          </label>
        </div>
      </section>

      <section class="section output-section">
        <div class="section-title">
          <h2>输出</h2>
          <div class="toolbar compact">
            <button id="copyBtn" class="ghost" type="button">复制</button>
            <button id="clearBtn" class="ghost" type="button">清空</button>
          </div>
        </div>
        <textarea id="outputArea" spellcheck="false"></textarea>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
